# Prefix
set -g prefix C-Space
set -g prefix2 C-b  # C-b is tmux default, kept as secondary prefix
bind C-Space send-prefix

set -g mouse on

# Reload config
bind q source-file ~/.tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Pane Controls
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

# Pane navigation with Ctrl+Shift+H/J/K/L (omarchy uses Ctrl+Alt+arrows)
unbind -n C-M-Left
unbind -n C-M-Right
unbind -n C-M-Up
unbind -n C-M-Down

bind -n C-S-H select-pane -L
bind -n C-S-L select-pane -R
bind -n C-S-K select-pane -U
bind -n C-S-J select-pane -D

bind -n C-S-Left  resize-pane -L 5
bind -n C-S-Right resize-pane -R 5
bind -n C-S-Up    resize-pane -U 5
bind -n C-S-Down  resize-pane -D 5

# Window navigation
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window

bind -n C-S-O select-window -t +1
bind -n C-S-I select-window -t -1
bind -n C-S-, swap-window -t -1 \; select-window -t -1
bind -n C-S-. swap-window -t +1 \; select-window -t +1

# Session controls
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n C-S-P switch-client -p
bind -n C-S-N switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off

# For image previews on neovim
set -g visual-activity off

# Zoom current pane
bind -n C-S-Z resize-pane -Z

# Extended Key Support for Modern Terminals
# Enable tmux to handle Ctrl/Alt/Shift combos and CSI-u encoding
set -g extended-keys on           # Turn on extended key support
set -g extended-keys-format csi-u # Use the modern CSI-u encoding for keys
set -as terminal-features ",xterm-ghostty:extkeys"  # Tell tmux Ghostty supports extended keys

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Theme - adapts to terminal color scheme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=colour2,bg=default,reverse] #S #[bg=default,noreverse] "
set -g status-right "#[fg=colour2]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=colour8]#h "
set -g window-status-format "#[fg=colour8] #I:#W "
set -g window-status-current-format "#[fg=colour2,bold] #I:#W "
set -g pane-border-style "fg=colour7"
set -g pane-active-border-style "fg=colour2"
set -g message-style "bg=default,fg=colour2"
set -g message-command-style "bg=default,fg=colour2"
set -g mode-style "bg=default,fg=colour2 reverse"
setw -g clock-mode-colour "colour2"
