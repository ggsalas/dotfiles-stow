onboarding = false
[keys]
prefix = "ctrl+space"

# Workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
switch_workspace = "prefix+shift+1..9"
previous_workspace = "ctrl+shift+p"
next_workspace = "ctrl+shift+n"
workspace_picker = ["prefix+w", "ctrl+shift+m"]
goto = ["prefix+j"]

# Navigate mode (workspace navigator, prefix+w or ctrl+shift+m): j/k or arrows
# move between workspaces; panes keep ctrl+shift+j/k like outside it
navigate_workspace_down = ["down", "j"]
navigate_workspace_up = ["up", "k"]
navigate_pane_down = "ctrl+shift+j"
navigate_pane_up = "ctrl+shift+k"

# Agents
previous_agent = "ctrl+shift+["
next_agent = "ctrl+shift+]"

# Tabs
previous_tab = "ctrl+shift+i"
next_tab = "ctrl+shift+o"

# Panes
focus_pane_left = "ctrl+shift+h"
focus_pane_down = "ctrl+shift+j"
focus_pane_up = "ctrl+shift+k"
focus_pane_right = "ctrl+shift+l"
split_horizontal = "prefix+h"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Miscellaneous
copy_mode = "prefix+["
toggle_sidebar = "ctrl+shift+;"
zoom = "ctrl+shift+z"

# Machine menu popup: add (authorizes your SSH key first), copy SSH key,
# reconnect, status, remove
[[keys.command]]
key = "prefix+m"
type = "popup"
command = "~/.config/herdr/scripts/machine-menu.sh"
description = "manage machines"
width = "60%"
height = "50%"

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[ui]
accent = "blue"
sidebar_collapsed_mode = "hidden"
tab_bar_position = "bottom"
agent_panel_sort = "spaces"
status_indicators = "dots"
show_agent_labels_on_pane_borders = false

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# status-right had the zoom flag followed by #h
# Current workspace (useful with the sidebar hidden). Absolute paths because
# command entries run on the Herdr server, whose PATH may not include Homebrew.
tab_bar_right = [
  { type = "zoom" },
  # "[workspace] - host" or "[workspace]: repo - host" for worktrees
  { type = "command", command = "~/.config/herdr/scripts/workspace-status.sh", interval_seconds = 1, timeout_seconds = 2 },
]

[theme]
# Use the terminal's own palette (Ghostty's Everforest, light/dark follows it)
name = "terminal"

[theme.custom]
panel_bg = "reset"

[ui.toast]
delivery = "terminal"
