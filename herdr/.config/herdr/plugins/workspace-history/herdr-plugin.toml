# Browser-style back/forward over the workspaces you focused on this server.
# Link once with: herdr plugin link ~/.config/herdr/plugins/workspace-history
# Bound in config.toml: ctrl+shift+p back, ctrl+shift+n forward.
id = "ggsalas.workspace-history"
name = "Workspace history"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Back/forward through recently focused workspaces"
platforms = ["linux", "macos"]

[[events]]
on = "workspace.focused"
command = ["sh", "history.sh", "record"]

[[actions]]
id = "back"
title = "Previous workspace in history"
contexts = ["global"]
command = ["sh", "history.sh", "back"]

[[actions]]
id = "forward"
title = "Next workspace in history"
contexts = ["global"]
command = ["sh", "history.sh", "forward"]
